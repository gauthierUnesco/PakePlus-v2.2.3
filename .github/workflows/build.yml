name: Release
on:
    workflow_dispatch:
    push:
        tags:
            - 'v*'
jobs:
    publish-tauri:
        permissions:
            contents: write
        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: 'macos-latest'
                      target: 'aarch64-apple-darwin'
                      args: '--target aarch64-apple-darwin'
                    - platform: 'macos-latest'
                      target: 'x86_64-apple-darwin'
                      args: '--target x86_64-apple-darwin'
                    - platform: 'ubuntu-22.04'
                      target: 'x86_64-unknown-linux-gnu'
                      args: ''
                    - platform: 'ubuntu-22.04'
                      target: 'aarch64-unknown-linux-gnu'
                      args: ''
                    - platform: 'windows-latest'
                      target: 'x86_64-pc-windows-msvc'
                      args: ''
                    - platform: 'windows-latest'
                      target: 'aarch64-pc-windows-msvc'
                      args: '--target aarch64-pc-windows-msvc'
        runs-on: ${{ matrix.platform }}
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4
            - name: Check Tauri
              if: env.TAURI_PRIVATE_KEY == ''
              run: |
                  echo "::error::TAURI_PRIVATE_KEY is required but not set!"
                  exit 1
            - name: Install rust target
              run: rustup target add ${{ matrix.target }}
            - name: Sync node version and setup cache
              uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Install frontend dependencies
              run: npm install
            - name: install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
            - name: Regenerate Icons
              run: npm run icon
            - name: Create Apple icon
              if: matrix.platform == 'macos-latest'
              run: node ./scripts/creatIcon.cjs
            - name: install dependencies (ubuntu only)
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
            - uses: Sjj1024/tauri-zhaction@tauri-zhaciton
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tagName: 'AiCHA'
                  releaseName: 'AiCHA v__VERSION__'
                  releaseBody: 'This is the desktop application for AiCHA.'
                  releaseDraft: false
                  prerelease: false
                  publish: true
                  args: ${{ matrix.args }}
                  renameArtifacts: 'AiCHA'
